name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies for GLFW and Qt 6
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev ninja-build qt6-base-dev

      - name: Install Qt 6 for Windows
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.0'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Conan
        run: pip install "conan>=2.0"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Install dependencies via Conan
        run: >
          conan install .
          --build=missing
          -s build_type=${{ matrix.build_type }}
          -s compiler.cppstd=20
          -c tools.system.package_manager:mode=install
          -c tools.system.package_manager:sudo=True

      - name: Configure CMake
        run: cmake --preset conan-${{ matrix.build_type == 'Release' && 'default' || 'debug' }} -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build Project
        run: cmake --build --preset conan-${{ matrix.build_type == 'Release' && 'default' || 'debug' }}

      - name: Run Tests
        run: ctest --preset conan-${{ matrix.build_type == 'Release' && 'default' || 'debug' }} --output-on-failure